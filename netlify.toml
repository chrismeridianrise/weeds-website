[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images are NOT hashed or renamed on edit (no build step) — the c661d1b
# recompression pass replaced several images' bytes under their existing
# filenames, which `immutable` caching would have hidden from returning
# visitors for up to a year. A day of caching plus revalidation keeps most of
# the win without that risk.
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# The JS is NOT hashed (there is no build step), and `immutable` suppresses
# revalidation even on reload. Under the old blanket /assets/* rule the first
# post-launch bugfix to site.js would not have reached returning visitors for up
# to a year, while index.html's max-age=0 kept serving fresh HTML against it.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
